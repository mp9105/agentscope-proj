<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇 · Snake</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1>贪吃蛇</h1>
        <p class="subtitle">Classic Snake · TypeScript + Canvas</p>
      </header>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">分数</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">最高分</span>
          <span id="high-score" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">速度</span>
          <span id="speed" class="stat-value">150 ms</span>
        </div>
      </div>

      <main class="stage">
        <canvas id="board" width="480" height="480"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-title" class="overlay-title">贪吃蛇</p>
          <p id="overlay-sub" class="overlay-sub">方向键 / WASD / 空格 开始</p>
          <button id="btn-start" class="btn" type="button">开始游戏</button>
        </div>
      </main>

      <footer class="hint">
        方向键 / WASD 移动 · 空格 / P 暂停或继续 · 结束后按 空格 / 回车 或点击按钮重新开始<br />
        每吃一个食物速度提升，撞墙或撞到自己则游戏结束
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
